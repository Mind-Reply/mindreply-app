name: Creator, Recruitment, PR & Events Intake
description: Stage a creator, hiring, PR, media or event-management opportunity for qualification.
title: "[OPS] "
labels:
  - operations
body:
  - type: dropdown
    id: department
    attributes:
      label: Department
      options:
        - Content Creator
        - Recruitment
        - PR Management
        - Events & Partnerships
    validations:
      required: true
  - type: input
    id: brand
    attributes:
      label: Brand or product
      description: Which owned brand/product does this support?
    validations:
      required: true
  - type: dropdown
    id: partnership_lane
    attributes:
      label: Partnership lane
      options:
        - Creator / Talent
        - Media / Press
        - Agency / Production
        - Event / Venue
        - Sponsor / Commercial Partner
        - Technology / Platform
        - Community / Institutional
        - Supplier / Contractor
        - Internal Recruitment
    validations:
      required: true
  - type: input
    id: counterpart
    attributes:
      label: Counterpart
      description: Creator, candidate, publication, venue, supplier, partner or organisation.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome is being pursued?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: URLs, source documents, portfolio, event page, role brief or other evidence. Discovery links are not proof of commitment.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - INTAKE
        - RESEARCH
        - QUALIFIED
        - PROPOSAL
        - AWAITING_APPROVAL
        - COMMITTED
        - IN_EXECUTION
        - DELIVERED
        - EVIDENCE_REVIEW
        - CLOSED
        - DECLINED
        - BLOCKED
    validations:
      required: true
  - type: textarea
    id: next_action
    attributes:
      label: Next action
    validations:
      required: true
  - type: input
    id: due_date
    attributes:
      label: Due date
      description: Use YYYY-MM-DD when a date is known.
  - type: input
    id: budget
    attributes:
      label: Budget
      description: Amount and currency, if applicable. Do not treat this as approved spend.
  - type: textarea
    id: rights_permissions
    attributes:
      label: Rights / permissions
      description: Content usage, image/video rights, whitelisting, exclusivity or other permissions relevant to the opportunity.
  - type: checkboxes
    id: approval
    attributes:
      label: Approval gate
      options:
        - label: No contract, spend, sponsorship, external commitment or privileged access is being represented as approved unless owner approval is recorded.
