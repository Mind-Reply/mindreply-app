name: A11 Live Evidence Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11-live-evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check declared public surfaces
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://a11-k.space" "https://mind-reply.github.io/A11-K/" "https://www.mind-reply.com/" "https://aurel.a11-k.space"; do
            status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
            echo "$url -> $status"
          done
          echo "Manual evidence check complete. No repository write or external mutation is performed."
