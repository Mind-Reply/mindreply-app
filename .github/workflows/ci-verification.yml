name: CI Verification

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, integrity, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          forbidden=""
          while IFS= read -r -d '' file; do
            base="${file##*/}"
            case "$base" in
              .env.example|.env.*.example) continue ;;
            esac
            case "$base" in
              .env|.env.*|*.pem|*.key|credentials.json)
                forbidden+="$file"$'\n'
                ;;
            esac
          done < <(git ls-files -z)
          if [ -n "$forbidden" ]; then
            echo "::error::Potential secret-bearing files are tracked:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Static checks
        run: pnpm run check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test

      - name: Production build
        run: pnpm run build
