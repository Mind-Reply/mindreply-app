name: Dependency security remediation

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Capture audit before
        run: pnpm audit --json > audit-before.json || true

      - name: Apply safe audit fixes
        run: pnpm audit --fix

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Capture audit after
        run: pnpm audit --json > audit-after.json || true

      - name: Validate lockfile install
        run: pnpm install --frozen-lockfile

      - name: Create remediation PR when changes exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'No dependency remediation changes produced.'
            exit 0
          fi

          branch="security/dependency-remediation-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml 2>/dev/null || true
          git add -u
          git commit -m 'security: remediate dependency advisories'
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title 'security: remediate dependency advisories' \
            --body 'Automated dependency-security remediation. The workflow captured audit-before/audit-after results, applied pnpm audit fixes, refreshed the lockfile, and verified a frozen install. Review the dependency diff and CI results before merging.'
