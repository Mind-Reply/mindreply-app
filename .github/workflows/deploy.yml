name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RWA Bridge image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/rwa-bridge:latest
            ghcr.io/${{ github.repository }}/rwa-bridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Next.js Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-replycontrol
          file: ./apps/web-replycontrol/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web-replycontrol:latest
            ghcr.io/${{ github.repository }}/web-replycontrol:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Vercel (Frontend)
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g vercel
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Health check RWA Bridge
        run: |
          docker run --rm \
            -e STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
            -e AGENT_WALLET_ADDRESS=${{ secrets.AGENT_WALLET_ADDRESS }} \
            ghcr.io/${{ github.repository }}/rwa-bridge:${{ github.sha }} \
            python -m pytest tests/ -v || true
