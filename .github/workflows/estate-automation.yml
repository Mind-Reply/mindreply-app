name: Estate Evidence Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          echo "Tracked environment/secret candidates:"
          git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$)' || true

          echo "Gitlink entries:"
          git ls-files -s | awk '$1 == 160000 {print $4}' || true

          echo "Legacy canonical-name references:"
          git grep -n "Mind-Reply/mindreply" -- ':!docs/POWERSON_ZERO_EXECUTION_REGISTER_2026-09-25.md' || true

          echo "Evidence check complete. No production promotion is performed by this workflow."
