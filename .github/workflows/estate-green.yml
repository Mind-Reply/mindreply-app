name: Estate Verification (blocking)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 3 -type f \( -name '.env' -o -name '.env.*' \) ! -name '*.example' | grep -q .; then
            echo "Environment file detected; review before release."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          node --version
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run MindReply AI Engine core tests
        run: node --test packages/llm-gateway/engine.test.mjs
      - name: Run tests
        run: pnpm test
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm --filter web-replycontrol dev
      - name: Build application
        run: pnpm build
      - name: Set up Node.js for isolated billing package
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Set up pinned pnpm for isolated billing package
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node --version
          pnpm --version
      - name: Install isolated billing package dependencies
        working-directory: phone-first-saas-starter
        run: pnpm install --no-frozen-lockfile
      - name: Validate billing package Prisma schema
        working-directory: phone-first-saas-starter
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
        run: pnpm exec prisma validate
      - name: Generate billing package Prisma Client
        working-directory: phone-first-saas-starter
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
        run: pnpm prisma:generate
      - name: Apply billing migrations to disposable PostgreSQL
        working-directory: phone-first-saas-starter
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
        run: pnpm prisma:migrate:deploy && pnpm exec prisma migrate status
      - name: Verify billing migration has no Prisma schema drift
        working-directory: phone-first-saas-starter
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Lint billing package
        working-directory: phone-first-saas-starter
        run: pnpm lint
      - name: Typecheck billing package
        working-directory: phone-first-saas-starter
        run: pnpm typecheck
      - name: Test billing package
        working-directory: phone-first-saas-starter
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          CLERK_SECRET_KEY: "sk_test_ci_placeholder"
          STRIPE_SECRET_KEY: "rk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          STRIPE_METER_BILLING_ENABLED: "false"
        run: pnpm test
      - name: Build billing package
        working-directory: phone-first-saas-starter
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
          CLERK_SECRET_KEY: "sk_test_ci_placeholder"
          STRIPE_SECRET_KEY: "rk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          STRIPE_METER_BILLING_ENABLED: "false"
        run: pnpm build
      - name: Publish verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Estate verification evidence"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Dependency, test, and build failures block this workflow."
            echo "- Release readiness requires all required steps to pass."
            echo "- Committed environment-file detection remains a blocking credential safeguard."
          } >> "$GITHUB_STEP_SUMMARY"
# Evidence-first verification; dependency, test, and build failures are blocking.
