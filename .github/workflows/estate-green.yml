name: Estate Verification (blocking)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 3 -type f \( -name '.env' -o -name '.env.*' \) ! -name '*.example' | grep -q .; then
            echo "Environment file detected; review before release."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          node --version
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm test
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm --filter web-replycontrol dev
      - name: Build application
        run: pnpm build
      - name: Publish verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Estate verification evidence"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Dependency, test, and build failures block this workflow."
            echo "- Release readiness requires all required steps to pass."
            echo "- Committed environment-file detection remains a blocking credential safeguard."
          } >> "$GITHUB_STEP_SUMMARY"
# Evidence-first verification; dependency, test, and build failures are blocking.
