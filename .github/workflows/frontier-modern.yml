name: Frontier Modern

on:
  push:
    branches: [main, 'frontier/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-modern-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo 'No Node package detected; repository validation complete.'
            exit 0
          fi

          corepack enable
          package_manager="$(node -p "require('./package.json').packageManager?.split('@')[0] || (require('fs').existsSync('pnpm-workspace.yaml') ? 'pnpm' : (require('fs').existsSync('yarn.lock') ? 'yarn' : 'npm'))")"
          case "$package_manager" in
            pnpm)
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
              if [ -f apps/web-replycontrol/package.json ]; then
                pnpm --filter web-replycontrol typecheck
                pnpm --filter web-replycontrol build
              else
                pnpm run build --if-present
                pnpm test --if-present
              fi
              ;;
            yarn)
              if [ -f yarn.lock ]; then yarn install --immutable; else yarn install; fi
              yarn build --if-present
              yarn test --if-present
              ;;
            *)
              if [ -f package-lock.json ]; then npm ci; else npm install; fi
              npm run build --if-present
              npm test --if-present
              ;;
          esac
