name: Temporary pnpm lockfile repair

on:
  push:
    branches: [ci/regenerate-pnpm-lockfile]
    paths:
      - '.github/workflows/repair-pnpm-lockfile.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/ci/regenerate-pnpm-lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/regenerate-pnpm-lockfile
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Regenerate lockfile without running package scripts
        run: pnpm install --lockfile-only --fix-lockfile --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile repair to this isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No lockfile changes generated; inspect install output.'
            exit 1
          fi
          git commit -m 'fix(ci): regenerate pnpm lockfile with pinned pnpm'
          git push origin HEAD:ci/regenerate-pnpm-lockfile
