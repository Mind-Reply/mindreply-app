name: Repository Integrity Gate
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git whitespace check
        run: git diff --check
      - name: Reject tracked local environment files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=""
          while IFS= read -r -d '' file; do
            base="${file##*/}"
            case "$base" in
              .env.example|.env.*.example) continue ;;
            esac
            case "$base" in
              .env|.env.*|*.pem|*.key|credentials.json)
                forbidden+="$file"$'\n'
                ;;
            esac
          done < <(git ls-files -z)
          if [ -n "$forbidden" ]; then
            echo "::error::Potential secret-bearing files are tracked:"
            printf '%s\n' "$forbidden"
            exit 1
          fi
      - name: Repository gate result
        run: echo "PASS — repository integrity checks completed."
