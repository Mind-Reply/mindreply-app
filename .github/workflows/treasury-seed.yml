name: Treasury Seed CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - 'scripts/seed-treasury.ts'
      - 'lib/db/treasury.schema.ts'
      - '.github/workflows/treasury-seed.yml'

env:
  NODE_VERSION: '24'

jobs:
  seed-treasury:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.32.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Validate TypeScript
        run: npx tsc --noEmit scripts/seed-treasury.ts
      
      - name: Run Treasury Seed
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/seed-treasury.ts
      
      - name: Verify Seed Success
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cat > verify-seed.ts << 'EOF'
          import { createClient } from "@supabase/supabase-js";
          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL!,
            process.env.SUPABASE_SERVICE_ROLE_KEY!
          );
          const { data, error } = await supabase
            .from("high_yield_account_registry")
            .select("COUNT(*) as count");
          if (error) throw error;
          console.log("✅ Seed verified:", data);
          EOF
          npx tsx verify-seed.ts
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Treasury Seed: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Treasury Seed* - ${{ job.status }}\nEnv: ${{ github.event.inputs.environment || 'staging' }}\nRef: ${{ github.ref }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
