name: Validate Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-replycontrol:
    name: web-replycontrol
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.32.1
      - name: Verify runtime and package manager
        run: |
          node --version
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check web application
        run: pnpm --filter web-replycontrol typecheck
      - name: Build web application
        run: pnpm --filter web-replycontrol build
      - name: Smoke test production server and core routes
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter web-replycontrol start --hostname 127.0.0.1 > /tmp/web-replycontrol.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          node -e 'const h=require("/tmp/health.json"); if(h.status!=="ok" || h.service!=="web-replycontrol" || h.release!==process.env.GITHUB_SHA) { console.error(h); process.exit(1); } console.log(JSON.stringify(h));'
          for route in / /pricing /contact; do
            curl --silent --show-error --fail --location "http://127.0.0.1:3000$route" --output /dev/null
            echo "PASS $route"
          done
