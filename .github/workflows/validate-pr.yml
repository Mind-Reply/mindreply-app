name: Validate Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-replycontrol:
    name: web-replycontrol
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.32.1
      - name: Verify runtime and package manager
        run: |
          node --version
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check web application
        run: pnpm --filter web-replycontrol typecheck
      - name: Build web application
        run: pnpm --filter web-replycontrol build
      - name: Verify health route exists
        run: test -f apps/web-replycontrol/app/api/health/route.ts
