name: Validate Pull Request

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web-replycontrol/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/validate-pr.yml"
      - "ops/protected-release/validate-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-replycontrol:
    name: web-replycontrol
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - name: Verify runtime
        run: |
          node --version
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check web application
        run: pnpm --filter web-replycontrol typecheck
      - name: Build web application
        run: pnpm --filter web-replycontrol build
      - name: Verify health route exists
        run: test -f apps/web-replycontrol/app/api/health/route.ts
