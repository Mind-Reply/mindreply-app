name: Validate Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-bootstrap:
    name: Node 26 runner bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Verify runtime
        run: |
          node --version
          npm --version
