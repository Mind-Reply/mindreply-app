version: '3.9'

# ============================================================================
# Kafka + Neo4j Infrastructure for Real-Time Telemetry & Graph Processing
# Usage: docker compose -f docker-compose.kafka.yml up -d
# ============================================================================

services:
  # ---- Kafka Cluster (3 brokers in KRaft mode, no Zookeeper) ----

  kafka-broker-1:
    image: confluentinc/cp-kafka:7.7.2
    container_name: kafka-broker-1
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:29091,PLAINTEXT_HOST://localhost:9091
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-broker-1
      CLUSTER_ID: MkQkSWZyeWNrQWFQc0RBaQ==
    ports:
      - "9091:9091"
      - "9101:9101"
    volumes:
      - kafka-broker-1-data:/var/lib/kafka/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9091"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.7.2
    container_name: kafka-broker-2
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_NODE_ID: 2
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-broker-2
      CLUSTER_ID: MkQkSWZyeWNrQWFQc0RBaQ==
    ports:
      - "9092:9092"
      - "9102:9101"
    volumes:
      - kafka-broker-2-data:/var/lib/kafka/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka-broker-3:
    image: confluentinc/cp-kafka:7.7.2
    container_name: kafka-broker-3
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_NODE_ID: 3
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-broker-3
      CLUSTER_ID: MkQkSWZyeWNrQWFQc0RBaQ==
    ports:
      - "9093:9093"
      - "9103:9101"
    volumes:
      - kafka-broker-3-data:/var/lib/kafka/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Kafka UI (Web Console) ----
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: mindreply
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:29091,kafka-broker-2:29092,kafka-broker-3:29093
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8081:8080"
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ---- Neo4j Graph Database ----
  neo4j:
    image: neo4j:5.24-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/mind-reply-neo4j-pass
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_memory_heap_initial__size: 1g
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
      NEO4J_server_default__advertised__address: localhost
      NEO4J_server_bolt__advertised__address: localhost:7687
      # APOC plugin (optional, for advanced procedures)
      NEO4J_PLUGINS: "[\"apoc\"]"
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs
      - ./services/neo4j/migrations:/var/lib/neo4j/import/migrations
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "mind-reply-neo4j-pass", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- Python Kafka → Neo4j Consumer ----
  kafka-neo4j-consumer:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: kafka-neo4j-consumer
    environment:
      KAFKA_BOOTSTRAP: kafka-broker-1:29091,kafka-broker-2:29092,kafka-broker-3:29093
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mind-reply-neo4j-pass
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: INFO
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - kafka-consumer-logs:/app/logs

  # ---- Health Check & Monitoring Service ----
  infrastructure-monitor:
    image: curlimages/curl:latest
    container_name: infrastructure-monitor
    command: |
      sh -c '
      echo "[Monitor] Starting Kafka + Neo4j infrastructure health checks..."
      while true; do
        echo "[$(date +"%Y-%m-%d %H:%M:%S")] === Infrastructure Health Check ===";
        
        echo "[$(date +"%Y-%m-%d %H:%M:%S")] Checking Kafka broker-1...";
        curl -sf http://kafka-broker-1:9101 > /dev/null && echo "✓ Kafka broker-1 OK" || echo "✗ Kafka broker-1 DOWN";
        
        echo "[$(date +"%Y-%m-%d %H:%M:%S")] Checking Kafka broker-2...";
        curl -sf http://kafka-broker-2:9101 > /dev/null && echo "✓ Kafka broker-2 OK" || echo "✗ Kafka broker-2 DOWN";
        
        echo "[$(date +"%Y-%m-%d %H:%M:%S")] Checking Kafka broker-3...";
        curl -sf http://kafka-broker-3:9101 > /dev/null && echo "✓ Kafka broker-3 OK" || echo "✗ Kafka broker-3 DOWN";
        
        echo "[$(date +"%Y-%m-%d %H:%M:%S")] Checking Neo4j Bolt (7687)...";
        nc -zv neo4j 7687 > /dev/null 2>&1 && echo "✓ Neo4j Bolt OK" || echo "✗ Neo4j Bolt DOWN";
        
        echo "[$(date +"%Y-%m-%d %H:%M:%S")] Checking Kafka UI (8081)...";
        curl -sf http://kafka-ui:8080 > /dev/null && echo "✓ Kafka UI OK" || echo "✗ Kafka UI DOWN";
        
        sleep 60;
      done
      '
    networks:
      - app-network
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
      - neo4j
      - kafka-ui
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  kafka-broker-1-data:
    driver: local
  kafka-broker-2-data:
    driver: local
  kafka-broker-3-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  kafka-consumer-logs:
    driver: local
