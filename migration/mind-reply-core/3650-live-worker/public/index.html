<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3650 LIVE</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d0f;color:#f4f5f6}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#182027 0,#0b0d0f 55%)}
    main{width:min(960px,92vw);padding:48px 0}
    h1{font-size:clamp(38px,8vw,76px);line-height:.95;margin:0 0 12px;letter-spacing:-.05em}
    p{color:#aeb6bf;margin:0 0 32px}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .card{border:1px solid #2a3137;border-radius:18px;padding:20px;background:#111417}
    .side{font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    .status{margin-top:10px;color:#aeb6bf}
    .proven{color:#dff7e8}
    .ready{color:#ffd58a}
    @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main>
  <h1>3650 LIVE</h1>
  <p>Five proof sides. One Worker. Evidence first.</p>
  <button id="refresh" type="button">Refresh evidence</button>
  <section class="grid" id="grid"></section>
</main>
<script>
const sides=["dubai","nyc","london","sofia","tokyo"];
const grid=document.getElementById("grid");
async function refresh(){
  const results=await Promise.all(sides.map(async side=>{
    try{
      const r=await fetch("https://"+side+".mind-reply.com/monitor/public",{cache:"no-store"});
      return await r.json();
    }catch(e){return {side,status:"UNVERIFIED"};}
  }));
  grid.innerHTML=results.map(item=>`
    <article class="card">
      <div class="side">${item.side||"unknown"}</div>
      <div class="status ${String(item.status||"").toLowerCase()}">${item.status||"UNVERIFIED"}</div>
    </article>`).join("");
}
refresh();
setInterval(refresh,30000);
</script>
</body>
</html>
