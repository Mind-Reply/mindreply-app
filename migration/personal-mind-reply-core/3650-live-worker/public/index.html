<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="3650 evidence monitor">
  <title>3650 LIVE</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07100f;color:#eaeaea;padding:24px}
    main{width:min(760px,100%);padding:28px;border:1px solid #17302c;border-radius:22px;background:#0b1614;box-shadow:0 20px 80px #0008}
    h1{margin:0 0 12px;letter-spacing:.18em;font-size:clamp(28px,7vw,52px)}
    .badge{display:inline-block;padding:8px 14px;border:1px solid #39413f;border-radius:999px;font-weight:700;letter-spacing:.08em}
    .proven{border-color:#5ee37b}.pending{border-color:#d7b85a}
    pre{overflow:auto;padding:16px;border-radius:14px;background:#050908;color:#cfd8d5}
  </style>
</head>
<body>
  <main>
    <h1>3650 LIVE</h1>
    <div id="status" class="badge pending">CHECKING...</div>
    <pre id="details">Loading evidence…</pre>
  </main>
  <script>
    fetch('/monitor/public',{cache:'no-store'})
      .then(r=>r.json())
      .then(data=>{
        const el=document.getElementById('status');
        el.textContent=data.status;
        el.className='badge '+(data.status==='PROVEN'?'proven':'pending');
        document.getElementById('details').textContent=JSON.stringify(data,null,2);
      })
      .catch(err=>{document.getElementById('status').textContent='UNAVAILABLE';document.getElementById('details').textContent=String(err)})
  </script>
</body>
</html>
