# Nginx Configuration for Unified Platform Routing

# Upstream services
upstream mind_reply {
    server mind-reply-web:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream a11k_enterprise {
    server a11k-enterprise:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream sofia_ledger {
    server sofia-tech-ledger:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream eu_ai_hub {
    server eu-ai-hub:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream eu_gateway {
    server eu-market-gateway:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

# Main server block
server {
    listen 80;
    server_name localhost mind-reply.local *.mind-reply.local;

    client_max_body_size 50M;
    
    # Logging
    access_log /var/log/nginx/platform-access.log combined;
    error_log /var/log/nginx/platform-error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Platform health endpoint (no rate limiting)
    location /platform/health {
        access_log off;
        return 200 "platform-healthy\n";
        add_header Content-Type text/plain;
    }

    # Platform status endpoint
    location /platform/status {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","timestamp":"$date_gmt","services":["mind-reply","a11k-enterprise","sofia-ledger","eu-ai-hub","eu-market-gateway"]}';
    }

    # Main Mind Reply app (root)
    location / {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://mind_reply;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # A11K Enterprise Console
    location /admin {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://a11k_enterprise;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;
        
        rewrite ^/admin/(.*)$ /$1 break;
    }

    # Sofia Tech Ledger
    location /ledger {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://sofia_ledger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        rewrite ^/ledger/(.*)$ /$1 break;
    }

    # EU AI Hub
    location /ai-hub {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://eu_ai_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        rewrite ^/ai-hub/(.*)$ /$1 break;
    }

    # EU Market Gateway
    location /gateway {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://eu_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        rewrite ^/gateway/(.*)$ /$1 break;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        
        proxy_pass http://mind_reply;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets (aggressive caching)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        proxy_pass http://mind_reply;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

