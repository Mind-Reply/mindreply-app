name: Promote MindReply Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to authorize production promotion"
        required: true
        type: string
      health_url:
        description: "HTTPS health endpoint to verify after deployment"
        required: true
        default: "https://mind-reply.com/api/health"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-mindreply
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mindreply-core

jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit authorization
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "DEPLOY"
          case "${{ inputs.health_url }}" in
            https://*) ;;
            *) echo "health_url must use HTTPS" >&2; exit 1 ;;
          esac

  build:
    needs: authorization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web-replycontrol/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-mindreply
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Promote exact image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/mind-reply-core && IMAGE_REF='$IMAGE_REF' docker compose -f docker-compose.prod.yml pull && IMAGE_REF='$IMAGE_REF' docker compose -f docker-compose.prod.yml up -d"
      - name: Verify production health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "${{ inputs.health_url }}"; then exit 0; fi
            sleep 10
          done
          exit 1
